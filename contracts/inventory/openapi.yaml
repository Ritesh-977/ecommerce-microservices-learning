openapi: 3.0.3
info:
  title: Inventory Service API
  version: 0.1.0
  description: |
    Stock levels and reservations. Reservation API is idempotent; holds expire via TTL.
    Stock is tracked as onHand - reserved. A reservation moves quantity from available to reserved;
    confirm decrements both onHand and reserved; release returns reserved quantity to available.
    Idempotency-Key is required for reserve/confirm/release. Replaying the same key with the same
    request returns the same reservation (and `Idempotency-Replayed: true`); reusing a key with a
    different request returns 409 IDEMPOTENCY_KEY_REUSE_CONFLICT.
  license:
    name: UNLICENSED
servers:
  - url: http://localhost:3003
    description: Local development
security:
  - SessionId: []
tags:
  - name: Health
    description: Service health and readiness
  - name: Inventory
    description: Stock levels
  - name: Reservations
    description: Idempotent stock reservations with TTL
paths:
  /health:
    get:
      operationId: getHealth
      summary: Service health check
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/Error"
  /v1/inventory/{productId}:
    get:
      operationId: getStock
      summary: Get stock for a product
      tags: [Inventory]
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Stock record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stock"
        "404":
          $ref: "#/components/responses/Error"
  /v1/inventory/reservations:
    post:
      operationId: createReservation
      summary: Reserve stock (with hold/TTL)
      description: |
        Atomically checks and reserves stock for the requested line items.
        Replaying with the same Idempotency-Key returns the same reservation outcome.
      tags: [Reservations]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        "201":
          description: Reservation created (held) or replayed idempotently
          headers:
            Idempotency-Replayed:
              description: Present and set to "true" when this is an idempotent replay
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Insufficient stock or conflicting idempotent request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/inventory/reservations/{reservationId}/confirm:
    post:
      operationId: confirmReservation
      summary: Confirm a reservation (decrement stock)
      tags: [Reservations]
      parameters:
        - $ref: "#/components/parameters/ReservationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Reservation confirmed (or already confirmed on replay)
          headers:
            Idempotency-Replayed:
              description: Present and set to "true" when this is an idempotent replay
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Reservation expired or already released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/inventory/reservations/{reservationId}/release:
    post:
      operationId: releaseReservation
      summary: Release a reservation (return held stock)
      tags: [Reservations]
      parameters:
        - $ref: "#/components/parameters/ReservationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Reservation released, expired, or already released (idempotent)
          headers:
            Idempotency-Replayed:
              description: Present and set to "true" when this is an idempotent replay
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Reservation already confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    SessionId:
      type: apiKey
      in: header
      name: X-Session-Id
      description: Guest session identifier (authentication may evolve later)
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
  responses:
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: inventory
    Stock:
      type: object
      required: [productId, onHand, reserved, available]
      properties:
        productId:
          type: string
        onHand:
          type: integer
          minimum: 0
          description: Physical units owned by the business.
        reserved:
          type: integer
          minimum: 0
          description: Units currently held by active reservations.
        available:
          type: integer
          minimum: 0
          description: onHand - reserved; units that can still be reserved.
    ReservationLine:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
          minLength: 1
          maxLength: 128
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
    CreateReservationRequest:
      type: object
      description: Product IDs must be unique within one reservation.
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ReservationLine"
        ttlSeconds:
          type: integer
          minimum: 30
          maximum: 3600
          default: 900
          description: How long the hold remains active before stock is released automatically.
    Reservation:
      type: object
      required: [reservationId, status, items, expiresAt, createdAt]
      properties:
        reservationId:
          type: string
        status:
          type: string
          enum: [held, confirmed, released, expired]
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReservationLine"
        expiresAt:
          type: string
          format: date-time
          description: When the hold expires if not confirmed or released. Unchanged by later state transitions.
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            correlationId:
              type: string
