# Local development infrastructure for the e-commerce microservices learning project.
# This is a skeleton; services and dependencies will be added incrementally.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional admin UI (uncomment to use):
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: ecommerce-pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change_me_local_only}
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  catalog:
    build:
      context: ./services/catalog
    container_name: ecommerce-catalog
    restart: unless-stopped
    environment:
      CATALOG_HOST: 0.0.0.0
      CATALOG_PORT: 3001
      CATALOG_DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-change_me_local_only}@postgres:5432/catalog_db?schema=public
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cart:
    build:
      context: ./services/cart
    container_name: ecommerce-cart
    restart: unless-stopped
    environment:
      CART_HOST: 0.0.0.0
      CART_PORT: 3002
      CART_DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-change_me_local_only}@postgres:5432/cart_db
      CATALOG_BASE_URL: http://catalog:3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Message broker will be added in Phase 7 (Kafka or RabbitMQ).
  # Other application services will be added as they are implemented.

volumes:
  postgres_data:

networks:
  default:
    name: ecommerce-learning-net
